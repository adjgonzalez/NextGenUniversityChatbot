<aside class="col-md-3 col-lg-2 mb-3">
   <div class="list-group">
     {% for item in admissions_sidebar_items %}
       <a href="{% url 'pages:admissions_page' item.slug %}"
          class="list-group-item list-group-item-action {% if current_page == item.slug %}active{% endif %}"
          data-page="{{ item.slug }}">
          {{ item.title }}
       </a>
     {% endfor %}
   </div>
 </aside>
