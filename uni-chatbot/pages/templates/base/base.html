<!DOCTYPE html>
<html lang="en">
  {% load static %}
  {% load i18n %}
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>
      {% block title %}Programs{% endblock %}
    </title>

    <title>Programs</title>
    {% block head %}{% endblock %}


    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS files-->
    <link rel="stylesheet" href="{% static 'mychatbot/style.css' %}">
    <link rel="stylesheet" href="{% static 'mychatbot/admissions.css' %}">
    <link rel="stylesheet" href="{% static 'mychatbot/pages.css' %}">
    <!-- Bootstrap Icons (for arrow icons) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Bootstrap JS (for collapse functionality) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


  </head>
  <body>
    {% include "./navbar.html" %}
    <div class="main-content container py-4">
      {% block content %}
      {% endblock %}
    </div>
    {% include "./footer.html" %}
    <!-- Optional Bootstrap JS  -->

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
    <script src="{% static 'js/chatbox.js' %}"></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
