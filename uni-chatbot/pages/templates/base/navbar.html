{% load static %}
<nav class="navbar navbar-expand-lg navbar-light bg-light py-3" style="position:relative;">
  <div class="container d-flex flex-row align-items-center justify-content-start position-relative" style="min-width:400px;">
    <!-- Logo -->
    <a class="navbar-brand" href="/">
      <img src="{% static 'images/logo.png' %}" alt="Logo" class="navbar-logo d-inline-block align-text-top">
    </a>
    <!-- Hamburger Toggler (shown on small screens) -->
    <button class="navbar-toggler" type="button" aria-label="Toggle navigation" onclick="document.querySelector('.navbar-links-mobile').classList.toggle('show')">
      &#9776;
    </button>
    <!-- Desktop Nav Pills -->
    <div class="main-navbar-links">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link {% if request.path == '/admissions/' %}active{% endif %}" href="/admissions/">Admissions</a></li>
        <li class="nav-item"><a class="nav-link {% if request.path == '/programs/' %}active{% endif %}" href="/programs/">Programs</a></li>
        <li class="nav-item"><a class="nav-link {% if request.path == '/contact/' %}active{% endif %}" href="/contact/">Contact Us</a></li>
        <li class="nav-item"><a class="nav-link {% if request.path == '/feedback/' %}active{% endif %}" href="{% url 'feedback_form' %}">Leave Feedback</a></li>
      </ul>
    </div>
    <!-- Right: Language, Register/Login -->
    <div class="navbar-nav navbar-controls ms-auto">
      <select name="language" id="googleLangSelect" class="form-select form-select-sm" style="background-color: #F7E396; color: #212529; width:auto;">
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="es">Español</option>
        <option value="it">Italiano</option>
        <option value="mn">Монгол</option>
        <option value="de">Deutsch</option>
        <option value="zh-CN">中文</option>
        <option value="ru">Русский</option>
        <option value="ar">العربية</option>
      </select>
      {% if user.is_authenticated %}
        <a class="nav-link" aria-label="Current User" title="Current User">
          Hello {{ user.username }}
        </a>
        <form class="logout d-inline" action="{% url 'users:logout' %}" method="post">
          {% csrf_token %}
          <button class="btn btn-primary ms-1" aria-label="Log Out" title="Log Out">
            Log Out
          </button>
        </form>
      {% else %}
        <a href="{% url 'users:register' %}" class="btn btn-primary" aria-label="User Registration" title="User Registration">
          Register
        </a>
        <a href="{% url 'users:login' %}" class="btn btn-primary" aria-label="User Log In" title="User Log In">
          Login
        </a>
      {% endif %}
    </div>
    <!-- Mobile Hamburger Menu (hidden by default, absolute for overlay) -->
    <div class="navbar-links-mobile">
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/admissions/">Admissions</a></li>
        <li><a href="/programs/">Programs</a></li>
        <li><a href="/contact/">Contact Us</a></li>
        <li><a href="{% url 'feedback_form' %}">Leave Feedback</a></li>
      </ul>
    </div>
  </div>
</nav>
