{% load static %}

<nav class="navbar navbar-expand-lg navbar-light bg-light py-3">
  <div class="container">
    <!-- Logo -->
    <a class="navbar-brand" href="/">
      <img src="{% static 'images/logo.png' %}" alt="Logo"  width="120" class="d-inline-block align-text-top">
    </a>
       
  </div>
</nav>

<!-- Bottom Navbar -->
<nav class="navbar navbar-expand-lg custom-bottom-navbar">
  <div class="container">
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link {% if request.path == '/admissions/' %}active{% endif %}" href="/admissions/">Admissions</a></li>
        <li class="nav-item"><a class="nav-link {% if request.path == '/programs/' %}active{% endif %}" href="/programs/">Programs</a></li>  
        <li class="nav-item"><a class="nav-link {% if request.path == '/faculty/' %}active{% endif %}" href="/faculty/">Faculty and Departments</a></li>
        <li class="nav-item"><a class="nav-link {% if request.path == '/contact/' %}active{% endif %}" href="/contact/">Contact Us</a></li>
        <li class="nav-item"><a class="nav-link {% if request.path == '/feedback/' %}active{% endif %}" href="{% url 'feedback_form' %}">Leave Feedback</a></li>

        {% if user.is_authenticated %}
          <li class="nav-item"><a class="nav-link" aria-label="Current User" title="Current User">Hello {{user.username}}</a></li>
          
          <form class="logout" action="{% url 'users:logout' %}" method="post">
            {% csrf_token %}
            <button class="btn btn-primary" aria-label="Log Out" title="Log Out">Log Out</button>
          </form>          
        {% else %}
          <li class="nav-item"><a href="{% url 'users:register' %}" class="btn btn-primary" aria-label="User Registration" title="User Registration">Register</a></li>
          <li class="nav-item"><a href="{% url 'users:login' %}" class="btn btn-primary" aria-label="User Log In" title="User Log In">Log In</a></li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
