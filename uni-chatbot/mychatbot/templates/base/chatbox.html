{% load static %}
<style>
:root {
  --squash-bg: #f4b942;
  --squash-hover: #e8a521;
  --squash-text: #473a20;
}

/* --- Modern Modal Container & Content --- */
.chatbot-modern {
  font-family: 'Segoe UI', 'Inter', Arial, sans-serif;
}
#chatbotModal .chatbot-modern.modal-content {
  border-radius: 18px !important;
  box-shadow: 0 8px 32px rgba(76,121,245,0.12), 0 1px 4px rgba(0,0,0,0.09);
  background: linear-gradient(135deg,#f4f7fb 0%, #e9edf7 100%) !important;
  border: 1px solid #e2e7f5 !important;
  overflow: hidden;
}
#chatbotModal .chatbot-modern .modal-header {
  background: #556FB5 !important;
  color: #fff !important;
  border-bottom: 1px solid #e2e7f5 !important;
  border-radius: 18px 18px 0 0 !important;
}
#chatbotModal .chatbot-modern .modal-title {
  font-size: 1.1rem !important;
  font-weight: 600 !important;
  letter-spacing: 0.5px !important;
}
#chatbotModal .chatbot-modern .alert,
#chatbotModal .chatbot-modern .alert-info,
#chatbotModal .chatbot-modern .alert-primary {
  border-radius: 16px !important;
  font-size: 1rem !important;
  border: none !important;
  box-shadow: 0 2px 10px 0 #e9edf7e6 !important;
  padding: 12px 22px !important;
  word-break: break-word !important;
  margin-bottom: 9px !important;
  clear: both !important;
}
#chatbotModal .chatbot-modern .alert-info {
  background: linear-gradient(120deg,#f4f7fb 92%,#e2e7f5 100%) !important;
  color: #312c47 !important;
  display: block !important;
  max-width: 90%;
  margin-right: auto;
  margin-left: 0;
  border-radius: 8px 18px 18px 18px !important;
  padding: 12px 22px !important;
}
#chatbotModal .chatbot-modern .alert-primary {
  background: linear-gradient(120deg,#c6655f 90%,#eaa199 100%) !important;
  color: #fff !important;
  text-align: left !important;
  box-shadow: 0 2px 14px #eed2cb2c !important;
  display: inline-block !important;
  float: right !important;
  max-width: 85%;
  margin-left: auto !important;
  margin-right: 0 !important;
  border-radius: 18px 18px 18px 8px !important;
  padding: 12px 22px 12px 16px !important;
}
#chatbotModal .chatbot-modern .gap-2,
#chatbotModal .chatbot-modern .mt-2,
#chatbotModal .chatbot-modern .d-flex {
  display: flex !important;
  gap: 10px !important;
  justify-content: center !important;
  flex-wrap: wrap !important;
  margin-bottom: 10px !important;
}
#chatbotModal .chatbot-modern .gap-2 .btn,
#chatbotModal .chatbot-modern .gap-2 button,
#chatbotModal .chatbot-modern .mt-2 .btn,
#chatbotModal .chatbot-modern .mt-2 button,
#chatbotModal .chatbot-modern .d-flex .btn,
#chatbotModal .chatbot-modern .d-flex button {
  margin: 2px 0 !important;
}
#chatbotModal .chatbot-modern .btn,
#chatbotModal .chatbot-modern button,
#chatbotModal .btn,
#chatbotModal button {
  border-radius: 10px !important;
  padding: 8px 20px !important;
  font-weight: 600 !important;
  color: #556FB5 !important;
  background: #fff !important;
  border: 2px solid #c3cee6 !important;
  box-shadow: 0 1px 9px 0 rgba(76,121,245,0.14) !important;
  transition: background 0.18s, color 0.12s !important;
  font-size: 1rem !important;
}
#chatbotModal .chatbot-modern .btn-primary,
#chatbotModal .chatbot-modern .btn-success {
  color: #fff !important;
  background: linear-gradient(120deg,#556FB5 80%,#4c79f5 100%) !important;
  border: none !important;
}
#chatbotModal .chatbot-modern .btn-success {
  background: linear-gradient(120deg,#51be8a 80%,#73dfa4 100%) !important;
}
#chatbotModal .chatbot-modern .btn-secondary {
  background: #d3dee5 !important;
  color: #446 !important;
  border: none !important;
}
#chatbotModal .chatbot-modern .btn:hover,
#chatbotModal .chatbot-modern .btn-primary:hover,
#chatbotModal .chatbot-modern button:hover,
#chatbotModal .btn:hover,
#chatbotModal button:hover {
  background: #556FB5 !important;
  color: #fff !important;
  border-color: #556FB5 !important;
}
#chatbotModal .chatbot-modern .form-control,
#chatbotModal .chatbot-modern .form-select {
  border-radius: 8px !important;
  border: 2px solid #c3cee6 !important;
  background: #f7f9fd !important;
  color: #3c436a !important;
  font-weight: 500 !important;
  padding: 8px 15px !important;
}
#chatbotModal .chatbot-modern .form-control:focus,
#chatbotModal .chatbot-modern .form-select:focus {
  border-color: #556fb5 !important;
  outline: none !important;
}
#chatbotModal .chatbot-modern .modal-footer {
  border-top: 1px solid #e2e7f5 !important;
  background: #fff !important;
  border-radius: 0 0 18px 18px !important;
  padding: 18px 18px 12px 18px !important;
  display: flex !important;
  flex-direction: column !important;
  gap: 10px !important;
}
#chatbotModal .chatbot-modern .form-check-label {
  font-size: 0.98rem !important;
  color: #556FB5 !important;
}
#chatbotModal .chatbot-modern #userEmail {
  margin-top: 4px !important;
  background: #f4f8fc !important;
}
#chatbotModal .chatbot-modern .modal-body {
  scrollbar-width: thin;
  scrollbar-color: #ddd #fff;
}
#chatbotModal .chatbot-modern .modal-body::-webkit-scrollbar {
  width: 8px;
  background: #fff0;
}
#chatbotModal .chatbot-modern .modal-body::-webkit-scrollbar-thumb {
  background: #ddd;
  border-radius: 8px;
}
.chatbot-vertical-tab {
  position: fixed;
  right: 0;
  top: 70%;
  z-index: 1050;
  width: 140px;
  height: 46px;
  background: var(--squash-bg);
  color: var(--squash-text);
  border: none;
  border-radius: 12px 12px 0 0;
  font-size: 1.15rem;
  font-weight: bold;
  box-shadow: 0 2px 18px rgba(80,60,0,0.14);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  letter-spacing: 0.03em;
  text-decoration: none;
  transition: background 0.16s, box-shadow 0.18s;
  outline: none;
  transform: rotate(-90deg);
  transform-origin: right bottom;
}
.chatbot-vertical-tab:hover, .chatbot-vertical-tab:focus {
  background: var(--squash-hover);
  color: #fff;
  box-shadow: 0 4px 28px 2px rgba(80,60,0,0.25);
}
@media (max-width:560px) {
  .chatbot-vertical-tab {
    width: 94px;
    height: 33px;
    font-size: 0.99rem;
    top: auto;
    bottom: 56px;
  }
}
.btn-close-custom {
  font-size: 1.5rem;
  font-weight: bold;
  color: #7a592c;
  background: transparent;
  border: none;
  padding: 0 .6rem;
  line-height: 1;
}
.btn-close-custom:hover, .btn-close-custom:focus {
  color: #b94c26;
  background: #f6e0b8;
}
</style>

<button class="chatbot-vertical-tab"
        data-bs-toggle="modal"
        data-bs-target="#chatbotModal"
        aria-label="Open chatbot">
  <span style="margin-right:.55em;">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none"
         xmlns="http://www.w3.org/2000/svg"
         style="vertical-align:middle;display:inline-block;">
      <path d="M5 19L7.5 17H17.5C18.33 17 19 16.33 19 15.5V4.5C19 3.67 18.33 3 17.5 3H4.5C3.67 3 3 3.67 3 4.5V15.5C3 16.33 3.67 17 4.5 17H5V19Z"
            stroke="black" stroke-width="2" fill="none"/>
    </svg>
  </span>
  Chat
</button>

<div class="modal fade" id="chatbotModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content chatbot-modern">
            <div class="modal-header">
                <h5 class="modal-title">University Assistant</h5>
                <button type="button" class="btn btn-light btn-close-custom" data-bs-dismiss="modal" aria-label="Close">✖</button>
            </div>
            <div class="modal-body" style="height: 300px; overflow-y: auto;" id="chatMessages">
                <div class="alert alert-info">
                    <p>Hello! Welcome to the NextGen university chatbot.</p>
                    <strong>Assistant:</strong> Are you already a student?
                </div>
                <div class="gap-2" id="initialDecision">
                    <button class="btn btn-outline-primary" id="yesButton" onclick="yesListener()">
                        ✅ Yes
                    </button>
                    <button class="btn btn-outline-primary" id="noButton" onclick="noListener()">
                        ❌ No
                    </button>
                </div>
            </div>
            <div class="modal-footer" id="chatbotFooter" style="display: none;">
                <div class="w-100 mb-2">
                  <div class="form-check mb-2">
                      <input class="form-check-input" type="checkbox" id="showFooterDetails">
                      <label class="form-check-label" for="showFooterDetails">
                          📧 Email me this conversation
                      </label>
                  </div>
                  <div id="footerDetails" style="display:none;">
                      <input type="email" class="form-control mt-2" id="userEmail" placeholder="Your email address">
                  </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
let transcriptSentFlag = false;
const CHATBOT_TEXT = {
    assistant: "Assistant", you: "You", yes: "Yes", no: "No",
    welcome: "Hello! Welcome to the NextGen university chatbot.",
    studentQuestion: "Are you already a student?",
    whatWouldYouLike: "What would you like to do?",
    whatTypeOfProgram: "What type of program are you interested in?",
    whichUndergraduate: "Which undergraduate program interests you?",
    whichGraduate: "Which graduate program interests you?",
    whichOnline: "Which online course interests you?",
    pleaseProvideEmail: "Please provide your email address and we will send your program resources.",
    describeIssue: "Please use the message box below to describe your issue. Check the box to receive a transcript of this conversation.",
    thankYouMessage: "Thank you for your message. An administrator will contact you shortly. Please ensure your email is correct to receive updates.",
    takingYouTo: "Taking you to the",
    page: "page...",
    emailResources: "Email me my program resources",
    contactAdministrator: "Contact Administrator",
    undergraduate: "Undergraduate", graduate: "Graduate", onlineCourses: "Online Courses",
    bscComputerScience: "BSc in Computer Science", baEconomics: "BA in Economics",
    mba: "MBA", mdscDataScience: "MDSc in Data Science", webDevelopment: "Web Development Bootcamp",
    introductionAI: "Introduction to AI",
    yesStudent: "Yes, I am a student", noStudent: "No, I am not a student",
    undergraduatePrograms: "Undergraduate programs", graduatePrograms: "Graduate programs", onlineCourses: "Online courses",
    contactAdminMessage: "I want to contact an administrator",
    transcriptSent: "Transcript sent to your email!",
    failedToSend: "Failed to send transcript.",
    includeEmail: "Please include your email above to receive program resources",
    selectProgram: "Please select a program",
    programSent: "Program resources sent to your email!"
};
const HARD_CODED_PROGRAMS = [
    { slug: 'bsc-computer-science', name: CHATBOT_TEXT.bscComputerScience },
    { slug: 'ba-economics', name: CHATBOT_TEXT.baEconomics },
    { slug: 'mba', name: CHATBOT_TEXT.mba },
    { slug: 'mdsc-data-science', name: CHATBOT_TEXT.mdscDataScience },
    { slug: 'web-development-bootcamp', name: CHATBOT_TEXT.webDevelopment },
    { slug: 'introduction-to-ai', name: CHATBOT_TEXT.introductionAI }
];

let conversationHistory = [
    { sender: "assistant", message: CHATBOT_TEXT.welcome },
    { sender: "assistant", message: CHATBOT_TEXT.studentQuestion }
];
let isAdminContactMode = false;
let pendingEmail = null;
let pendingProgram = null;
let resourceRequestInProgress = false;

function getCookie(name) {
    // ... unchanged ...
    var cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        var cookies = document.cookie.split(';');
        for (var i = 0; i < cookies.length; i++) {
            var cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
function getCSRFToken() {
    // ... unchanged ...
    return document.querySelector('[name=csrfmiddlewaretoken]')?.value || getCookie('csrftoken') || '';
}
function addToConversation(sender, message) {
    conversationHistory.push({ sender: sender, message: message });
    const chatMessages = document.getElementById('chatMessages');
    const messageDiv = document.createElement('div');
    messageDiv.className = `alert ${sender === 'user' ? 'alert-primary' : 'alert-info'}`;
    messageDiv.innerHTML = `<strong>${sender === 'user' ? CHATBOT_TEXT.you : CHATBOT_TEXT.assistant}:</strong> ${message}`;
    chatMessages.appendChild(messageDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}
function showButtons(buttonHTML) {
    const chatMessages = document.getElementById('chatMessages');
    const buttonContainer = document.createElement('div');
    buttonContainer.className = 'gap-2 mt-2';
    buttonContainer.innerHTML = buttonHTML;
    chatMessages.appendChild(buttonContainer);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}
function hideAllButtons() {
    const buttonContainers = document.querySelectorAll('#chatMessages .gap-2');
    buttonContainers.forEach(container => {
        container.remove();
    });
}
function toggleFooter(show) {
    const footer = document.getElementById('chatbotFooter');
    footer.style.display = show ? 'block' : 'none';
    isAdminContactMode = show;
}
function showEmailOption() {
    hideAllButtons();
    toggleFooter(false);
    resourceRequestInProgress = true;
    pendingEmail = null;
    pendingProgram = null;
    addToConversation('assistant', CHATBOT_TEXT.pleaseProvideEmail);
    showEmailCollectionForm();
}
function showEmailCollectionForm() {
    const existingForm = document.getElementById('programEmailForm');
    if (existingForm) existingForm.remove();

    const chatMessages = document.getElementById('chatMessages');
    const formDiv = document.createElement('div');
    formDiv.id = 'programEmailForm';
    formDiv.className = 'mt-2';

    let optionsHtml = '<option value="">' + CHATBOT_TEXT.selectProgram + '</option>';
    HARD_CODED_PROGRAMS.forEach(function (p) {
        optionsHtml += `<option value="${p.slug}">${p.name}</option>`;
    });

    formDiv.innerHTML = `
        <div class="mb-2">
            <label for="programSelect" class="form-label visually-hidden">${CHATBOT_TEXT.selectProgram}</label>
            <select id="programSelect" class="form-select mb-2">${optionsHtml}</select>
        </div>
        <div class="mb-2">
            <input type="email" class="form-control" id="programEmailInput"
                required placeholder="${CHATBOT_TEXT.includeEmail}">
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-success" type="button" id="programEmailSubmit">Send</button>
            <button class="btn btn-secondary" type="button" id="programEmailCancel">Cancel</button>
        </div>
    `;
    chatMessages.appendChild(formDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;

    document.getElementById('programEmailCancel').addEventListener('click', function () {
        document.getElementById('programEmailForm')?.remove();
    });

    document.getElementById('programEmailSubmit').addEventListener('click', function () {
        submitProgramEmail();
    });

    const emailInput = document.getElementById('programEmailInput');
    emailInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            submitProgramEmail();
        }
    });
}
function submitProgramEmail() {
    const emailInput = document.getElementById('programEmailInput');
    const programSelect = document.getElementById('programSelect');
    const email = emailInput?.value?.trim();
    const programSlug = programSelect?.value;
    const programName = programSelect?.options[programSelect.selectedIndex]?.text || '';

    if (!email) {
        showAlert("Please enter a valid email address.", 'danger');
        return;
    }
    if (!programSlug) {
        showAlert(CHATBOT_TEXT.selectProgram, 'danger');
        return;
    }

    pendingEmail = email;
    pendingProgram = { slug: programSlug, name: programName };

    addToConversation('user', `My email: ${email}`);
    addToConversation('user', `Program: ${programName}`);

    document.getElementById('programEmailForm')?.remove();

    fetch('/send-program-resources/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCSRFToken()
        },
        body: JSON.stringify({
            email: pendingEmail,
            program_slug: pendingProgram.slug,
            program_name: pendingProgram.name
        })
    })
    .then(response => response.json().catch(()=>({})))
    .then(data => {
        if (data && data.success) {
            addToConversation('assistant', CHATBOT_TEXT.programSent);
            showAlert(CHATBOT_TEXT.programSent, 'success');
        } else {
            addToConversation('assistant', data.message || "Failed to send program resources.");
            showAlert(data.message || "Failed to send program resources.", 'danger');
        }
        resourceRequestInProgress = false;
        pendingEmail = null;
        pendingProgram = null;
    })
    .catch(() => {
        addToConversation('assistant', "There was an error sending your resources. Please try again later.");
        showAlert("There was an error sending your resources. Please try again later.", 'danger');
        resourceRequestInProgress = false;
        pendingEmail = null;
        pendingProgram = null;
    });
}

function yesListener(){
    hideAllButtons();
    toggleFooter(false);
    addToConversation('user', `✅ ${CHATBOT_TEXT.yesStudent}`);
    addToConversation('assistant', CHATBOT_TEXT.whatWouldYouLike);

    const studentButtonsHTML = `
        <button class="btn btn-outline-primary program-option" onclick="addToConversation('user', '📧 ${CHATBOT_TEXT.emailResources}'); showEmailOption()">
            📧 ${CHATBOT_TEXT.emailResources}
        </button>
        <button class="btn btn-outline-primary program-option" onclick="contactAdmin()">
            👨‍💼 ${CHATBOT_TEXT.contactAdministrator}
        </button>
    `;
    showButtons(studentButtonsHTML);
}
function noListener(){
    hideAllButtons();
    toggleFooter(false);
    addToConversation('user', `❌ ${CHATBOT_TEXT.noStudent}`);
    addToConversation('assistant', CHATBOT_TEXT.whatTypeOfProgram);

    const studyTypeButtonsHTML = `
        <button class="btn btn-outline-primary program-option" onclick="underGradListener()">
            🎓 ${CHATBOT_TEXT.undergraduate}
        </button>
        <button class="btn btn-outline-primary program-option" onclick="gradListener()">
            📖 ${CHATBOT_TEXT.graduate}
        </button>
        <button class="btn btn-outline-primary program-option" onclick="onlineStudiesListener()">
            🌐 ${CHATBOT_TEXT.onlineCourses}
        </button>
    `;
    showButtons(studyTypeButtonsHTML);
}
function underGradListener(){
    hideAllButtons();
    toggleFooter(false);
    addToConversation('user', `🎓 ${CHATBOT_TEXT.undergraduatePrograms}`);
    addToConversation('assistant', CHATBOT_TEXT.whichUndergraduate);

    const undergradButtonsHTML = `
        <button class="btn btn-outline-primary program-option" onclick="redirect('/programs/bsc-in-computer-science/', '🎓 ${CHATBOT_TEXT.bscComputerScience}')">
            🖥️ ${CHATBOT_TEXT.bscComputerScience}
        </button>
        <button class="btn btn-outline-primary program-option" onclick="redirect('/programs/ba-in-economics/', '🎓 ${CHATBOT_TEXT.baEconomics}')">
            📈 ${CHATBOT_TEXT.baEconomics}
        </button>
    `;
    showButtons(undergradButtonsHTML);
}
function gradListener(){
    hideAllButtons();
    toggleFooter(false);
    addToConversation('user', `🎯 ${CHATBOT_TEXT.graduatePrograms}`);
    addToConversation('assistant', CHATBOT_TEXT.whichGraduate);

    const gradButtonsHTML = `
        <button class="btn btn-outline-primary program-option" onclick="redirect('/programs/mba/', '🎯 ${CHATBOT_TEXT.mba}')">
            💼 ${CHATBOT_TEXT.mba}
        </button>
        <button class="btn btn-outline-primary program-option" onclick="redirect('/programs/mdsc-in-data-science/', '🎯 ${CHATBOT_TEXT.mdscDataScience}')">
            📊 ${CHATBOT_TEXT.mdscDataScience}
        </button>
    `;
    showButtons(gradButtonsHTML);
}
function onlineStudiesListener(){
    hideAllButtons();
    toggleFooter(false);
    addToConversation('user', `🌐 ${CHATBOT_TEXT.onlineCourses}`);
    addToConversation('assistant', CHATBOT_TEXT.whichOnline);

    const onlineButtonsHTML = `
        <button class="btn btn-outline-primary program-option" onclick="redirect('/programs/web-development-bootcamp/', '🌐 ${CHATBOT_TEXT.webDevelopment}')">
            🌐 ${CHATBOT_TEXT.webDevelopment}
        </button>
        <button class="btn btn-outline-primary program-option" onclick="redirect('/programs/introduction-to-ai/', '🌐 ${CHATBOT_TEXT.introductionAI}')">
            🤖 ${CHATBOT_TEXT.introductionAI}
        </button>
    `;
    showButtons(onlineButtonsHTML);
}
function redirect(path, programName){
    hideAllButtons();
    toggleFooter(false);
    addToConversation('user', `${programName}`);
    addToConversation('assistant', `${CHATBOT_TEXT.takingYouTo} ${programName} ${CHATBOT_TEXT.page}`);
    setTimeout(() => {
        window.location.href = path;
    }, 1500);
}

function contactAdmin() {
    hideAllButtons();
    toggleFooter(true);
    addToConversation('user', `👨‍💼 ${CHATBOT_TEXT.contactAdminMessage}`);
    addToConversation('assistant', CHATBOT_TEXT.describeIssue);

    document.getElementById('adminMessageInputContainer')?.remove();

    const chatMessages = document.getElementById('chatMessages');
    const inputDiv = document.createElement('div');
    inputDiv.id = 'adminMessageInputContainer';
    inputDiv.className = 'mt-2 mb-2';
    inputDiv.innerHTML = `
        <textarea class="form-control mb-2" id="adminMessageInput" placeholder="Type your issue here..." rows="3"></textarea>
        <button class="btn btn-primary" id="adminMessageSubmit">Send to Administrator</button>
    `;
    chatMessages.appendChild(inputDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;

    document.getElementById('adminMessageSubmit').onclick = function() {
        const msg = document.getElementById('adminMessageInput').value.trim();
        if(msg) {
            addToConversation('user', msg);
            inputDiv.remove();
            addToConversation('assistant', CHATBOT_TEXT.thankYouMessage);
            sendTranscriptIfNeeded(); // <-- Send transcript when admin message sent!
        }
    };
}

// ---- Send transcript if needed on modal close ----
function sendTranscriptIfNeeded() {
    if (transcriptSentFlag) return; // Do not send again
    var transcriptChecked = false;
    var userEmail = '';
    var checkboxEl = document.getElementById('showFooterDetails');
    var emailEl = document.getElementById('userEmail');
    if (checkboxEl && emailEl) {
        transcriptChecked = checkboxEl.checked;
        userEmail = emailEl.value.trim();
    }

    if (transcriptChecked && userEmail) {
        var transcript = conversationHistory.map(obj => `${obj.sender}: ${obj.message}`).join('\n');
        console.log('SEND EMAIL TO:', userEmail);
        console.log('EMAIL CONTENT:', transcript);
        setTimeout(function() {
            showAlert(CHATBOT_TEXT.transcriptSent, 'success');
        }, 100);
        transcriptSentFlag = true; // only send once per chat session
    }
}

function showAlert(message, type) {
    const footer = document.querySelector('.modal-footer');
    if (!footer) return;
    const alertDiv = document.createElement('div');
    alertDiv.className = `alert alert-${type === 'success' ? 'success' : 'danger'} mt-2`;
    alertDiv.textContent = message;
    footer.prepend(alertDiv);
    setTimeout(() => alertDiv.remove(), 3000);
}

function resetChatbotVisibility() {
    conversationHistory = [
        { sender: "assistant", message: CHATBOT_TEXT.welcome },
        { sender: "assistant", message: CHATBOT_TEXT.studentQuestion }
    ];
    const chatMessages = document.getElementById('chatMessages');
    chatMessages.innerHTML = `
        <div class="alert alert-info">
            <p>${CHATBOT_TEXT.welcome}</p>
            <strong>${CHATBOT_TEXT.assistant}:</strong> ${CHATBOT_TEXT.studentQuestion}
        </div>
        <div class="gap-2" id="initialDecision">
            <button class="btn btn-outline-primary" id="yesButton" onclick="yesListener()">
                ✅ ${CHATBOT_TEXT.yes}
            </button>
            <button class="btn btn-outline-primary" id="noButton" onclick="noListener()">
                ❌ ${CHATBOT_TEXT.no}
            </button>
        </div>
    `;
    toggleFooter(false);
    isAdminContactMode = false;
    resourceRequestInProgress = false;
    pendingEmail = null;
    pendingProgram = null;
    document.getElementById('adminMessageInputContainer')?.remove();
    chatMessages.scrollTop = 0;
}

document.addEventListener('DOMContentLoaded', function () {
    var checkbox = document.getElementById('showFooterDetails');
    var footerDetails = document.getElementById('footerDetails');
    var userEmail = document.getElementById('userEmail');
    checkbox.addEventListener('change', function() {
        if (this.checked) {
            footerDetails.style.display = 'block';
            userEmail.style.display = '';
            userEmail.focus();
        } else {
            footerDetails.style.display = 'none';
        }
    });
    footerDetails.style.display = checkbox.checked ? 'block' : 'none';

    const chatbotModal = document.getElementById('chatbotModal');
    chatbotModal.addEventListener('hidden.bs.modal', function () {
        sendTranscriptIfNeeded();
        resetChatbotVisibility();
    });
});
</script>
