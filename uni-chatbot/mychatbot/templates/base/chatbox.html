{% load static %}
<button class="chatbot-vertical-tab"
        data-bs-toggle="modal"
        data-bs-target="#chatbotModal"
        aria-label="Open chatbot">
  <span style="margin-right:.55em;">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none"
         xmlns="http://www.w3.org/2000/svg"
         style="vertical-align:middle;display:inline-block;">
      <path d="M5 19L7.5 17H17.5C18.33 17 19 16.33 19 15.5V4.5C19 3.67 18.33 3 17.5 3H4.5C3.67 3 3 3.67 3 4.5V15.5C3 16.33 3.67 17 4.5 17H5V19Z"
            stroke="black" stroke-width="2" fill="none"/>
    </svg>
  </span>
  Chat
</button>

<div class="modal fade" id="chatbotModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content chatbot-modern">
            <div class="modal-header">
                <h5 class="modal-title">University Assistant</h5>
                <button type="button" class="btn btn-close-custom" data-bs-dismiss="modal" aria-label="Close">✖</button>
            </div>
            <div class="modal-body" style="height: 300px; overflow-y: auto;" id="chatMessages">
                <div class="alert alert-info">
                    <p>Hello! Welcome to the NextGen university chatbot.</p>
                    <strong>Assistant:</strong> Are you already a student?
                </div>
                <div class="gap-2" id="initialDecision">
                    <button class="btn btn-outline-primary" id="yesButton" onclick="yesListener()">
                        ✅ Yes
                    </button>
                    <button class="btn btn-outline-primary" id="noButton" onclick="noListener()">
                        ❌ No
                    </button>
                </div>
            </div>
            <div class="modal-footer" id="chatbotFooter" style="display: none;">
                <div class="w-100 mb-2">
                  <div class="form-check mb-2">
                      <input class="form-check-input" type="checkbox" id="showFooterDetails">
                      <label class="form-check-label" for="showFooterDetails">
                          📧 Email me this conversation
                      </label>
                  </div>
                    <div class="input-group mt-2">
                  <input type="text" id="chatbotFreeText" class="form-control" placeholder="Type your question or request..." />
                  <button class="btn btn-primary" id="chatbotSend" type="button">Send</button>
                </div>
                  <div id="footerDetails" style="display:none;">
                      <input type="email" class="form-control mt-2" id="userEmail" placeholder="Your email address">
                  </div>
                </div>
            </div>
        </div>
    </div>
</div>

function checkIntentAndHandle(msg) {
    msg = msg.toLowerCase().trim();

    // 1. Exact match first
    if (INTENT_DICTIONARY[msg]) {
        const action = INTENT_DICTIONARY[msg];
        handleAction(action, msg);
        return true;
    }

    // 2. Keyword/substring match: look for any INTENT_DICTIONARY key inside the input
    for (const key of Object.keys(INTENT_DICTIONARY)) {
        // Skip matching if key is very short, to avoid false positives
        if (key.length < 3) continue;
        if (msg.includes(key)) {
            const action = INTENT_DICTIONARY[key];
            handleAction(action, key);
            return true;
        }
    }

    // 3. Fallback
    addToConversation('assistant', "Sorry, I didn't recognize that. Please choose an option or try rephrasing your question.");
    return false;
}

function handleAction(action, matchedKey = "") {
    if (typeof action === "function") {
        action();
    } else if (typeof action === "object") {
        if (action.reply) addToConversation('assistant', action.reply);
        if (action.redirect) {
            redirect(action.redirect, matchedKey || action.reply || "program");
        }
    }
}
function handleFreeTextInput() {
    const inputEl = document.getElementById('chatbotFreeText');
    const userMessage = inputEl.value.trim();
    if (!userMessage) return;
    addToConversation('user', userMessage);
    inputEl.value = "";
    checkIntentAndHandle(userMessage);
}

function getCookie(name) {
    var cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        var cookies = document.cookie.split(';');
        for (var i = 0; i < cookies.length; i++) {
            var cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
function getCSRFToken() {
    return document.querySelector('[name=csrfmiddlewaretoken]')?.value || getCookie('csrftoken') || '';
}
function addToConversation(sender, message) {

    const messageDiv = document.createElement('div');
    messageDiv.className = `alert ${sender === 'user' ? 'alert-primary' : 'alert-info'}`;
    messageDiv.innerHTML = `<strong>${sender === 'user' ? CHATBOT_TEXT.you : CHATBOT_TEXT.assistant}:</strong> ${message}`;
    chatMessages.appendChild(messageDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;

            <button class="btn btn-secondary" type="button" id="programEmailCancel">Cancel</button>
        </div>
    `;
    chatMessages.appendChild(formDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;

    document.getElementById('programEmailCancel').addEventListener('click', function () {
        document.getElementById('programEmailForm')?.remove();
    });

    document.getElementById('programEmailSubmit').addEventListener('click', function () {

function submitProgramEmail() {
    const emailInput = document.getElementById('programEmailInput');
    const programSelect = document.getElementById('programSelect');
    const email = emailInput?.value?.trim();
    const programSlug = programSelect?.value;
    const programName = programSelect?.options[programSelect.selectedIndex]?.text || '';

    if (!email) {
        showAlert("Please enter a valid email address.", 'danger');
        return;
    }
    if (!programSlug) {
        showAlert(CHATBOT_TEXT.selectProgram, 'danger');
        return;
    }

    pendingEmail = email;
    pendingProgram = { slug: programSlug, name: programName };

    addToConversation('user', `My email: ${email}`);
    addToConversation('user', `Program: ${programName}`);

    document.getElementById('programEmailForm')?.remove();

    fetch('/send-program-resources/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCSRFToken()
        },
        body: JSON.stringify({
            email: pendingEmail,
            program_slug: pendingProgram.slug,
            program_name: pendingProgram.name
        })
    })
    .then(response => response.json().catch(()=>({})))
    .then(data => {
        if (data && data.success) {
            addToConversation('assistant', CHATBOT_TEXT.programSent);
            showAlert(CHATBOT_TEXT.programSent, 'success');
        } else {
            addToConversation('assistant', data.message || "Failed to send program resources.");
            showAlert(data.message || "Failed to send program resources.", 'danger');
        }
        resourceRequestInProgress = false;
        pendingEmail = null;
        pendingProgram = null;
    })
    .catch(() => {
        addToConversation('assistant', "There was an error sending your resources. Please try again later.");
        showAlert("There was an error sending your resources. Please try again later.", 'danger');
        resourceRequestInProgress = false;
        pendingEmail = null;
        pendingProgram = null;
    });
}

function contactAdmin() {
    hideAllButtons();
    toggleFooter(true);
    addToConversation('user', `👨‍💼 ${CHATBOT_TEXT.contactAdminMessage}`);
    addToConversation('assistant', CHATBOT_TEXT.describeIssue);

    document.getElementById('adminMessageInputContainer')?.remove();

    const chatMessages = document.getElementById('chatMessages');
    const inputDiv = document.createElement('div');
    inputDiv.id = 'adminMessageInputContainer';
    inputDiv.className = 'mt-2 mb-2';
    inputDiv.innerHTML = `
        <textarea class="form-control mb-2" id="adminMessageInput" placeholder="Type your issue here..." rows="3"></textarea>
        <button class="btn btn-primary" id="adminMessageSubmit">Send to Administrator</button>
    `;
    chatMessages.appendChild(inputDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;

    document.getElementById('adminMessageSubmit').onclick = function() {
        const msg = document.getElementById('adminMessageInput').value.trim();
        if(msg) {
            addToConversation('user', msg);
            inputDiv.remove();
            addToConversation('assistant', CHATBOT_TEXT.thankYouMessage);
            sendTranscriptIfNeeded(); // <-- Send transcript when admin message sent!
        }
    };
}

// ---- Send transcript if needed on modal close ----
function sendTranscriptIfNeeded() {
    if (transcriptSentFlag) return; // Do not send again
    var transcriptChecked = false;
    var userEmail = '';
    var checkboxEl = document.getElementById('showFooterDetails');
    var emailEl = document.getElementById('userEmail');
    if (checkboxEl && emailEl) {
        transcriptChecked = checkboxEl.checked;
        userEmail = emailEl.value.trim();
    }

    if (transcriptChecked && userEmail) {
        var transcript = conversationHistory.map(obj => `${obj.sender}: ${obj.message}`).join('\n');
        console.log('SEND EMAIL TO:', userEmail);
        console.log('EMAIL CONTENT:', transcript);
        setTimeout(function() {
            showAlert(CHATBOT_TEXT.transcriptSent, 'success');
        }, 100);
        transcriptSentFlag = true; // only send once per chat session
    }
}

function showAlert(message, type) {
    const footer = document.querySelector('.modal-footer');
    if (!footer) return;
    const alertDiv = document.createElement('div');
    alertDiv.className = `alert alert-${type === 'success' ? 'success' : 'danger'} mt-2`;
    alertDiv.textContent = message;
    footer.prepend(alertDiv);
    setTimeout(() => alertDiv.remove(), 3000);
}

function resetChatbotVisibility() {
    conversationHistory = [
        { sender: "assistant", message: CHATBOT_TEXT.welcome },
        { sender: "assistant", message: CHATBOT_TEXT.studentQuestion }
    ];
    const chatMessages = document.getElementById('chatMessages');
    chatMessages.innerHTML = `
        <div class="alert alert-info">
            <p>${CHATBOT_TEXT.welcome}</p>
            <strong>${CHATBOT_TEXT.assistant}:</strong> ${CHATBOT_TEXT.studentQuestion}
        </div>
        <div class="gap-2" id="initialDecision">
            <button class="btn btn-outline-primary" id="yesButton" onclick="yesListener()">
                ✅ ${CHATBOT_TEXT.yes}
            </button>
            <button class="btn btn-outline-primary" id="noButton" onclick="noListener()">
                ❌ ${CHATBOT_TEXT.no}
            </button>
        </div>
    `;
    toggleFooter(false);
    isAdminContactMode = false;
    resourceRequestInProgress = false;
    pendingEmail = null;
    pendingProgram = null;
    document.getElementById('adminMessageInputContainer')?.remove();
    chatMessages.scrollTop = 0;
}

document.addEventListener('DOMContentLoaded', function () {
    var checkbox = document.getElementById('showFooterDetails');
    var footerDetails = document.getElementById('footerDetails');
    var userEmail = document.getElementById('userEmail');
    checkbox.addEventListener('change', function() {
        if (this.checked) {
            footerDetails.style.display = 'block';
            userEmail.style.display = '';
            userEmail.focus();
        } else {
            footerDetails.style.display = 'none';
        }
    });
    footerDetails.style.display = checkbox.checked ? 'block' : 'none';
    document.getElementById('chatbotSend').onclick = handleFreeTextInput;
    document.getElementById('chatbotFreeText').addEventListener('keypress', function(e) {
        if (e.key === "Enter") handleFreeTextInput();
    });
    const chatbotModal = document.getElementById('chatbotModal');
    chatbotModal.addEventListener('hidden.bs.modal', function () {
        sendTranscriptIfNeeded();
        resetChatbotVisibility();
    });
});
</script>
