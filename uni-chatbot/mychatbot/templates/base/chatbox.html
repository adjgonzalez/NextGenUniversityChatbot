<!-- Bootstrap Chat Widget -->
    <button class="btn btn-primary rounded-circle chatbot-btn"
            data-bs-toggle="modal"
            data-bs-target="#chatbotModal">
        💬
    </button>

                <div class="modal fade" id="chatbotModal" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">University Assistant</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body" style="height: 300px; overflow-y: auto;" id="chatMessages">
                <div class="alert alert-info">
                    <p>Hello! Welcome to the NextGen university chatbot.</p>
                    <strong>Assistant:</strong> Are you already a student?
                </div>
                <div class="gap-2" id="initialDecision">
                    <button class="btn btn-outline-primary" id='yesButton' onclick="yesListener()">
                        ✅ Yes
                    </button>
                    <button class="btn btn-outline-primary" id='noButton' onclick="noListener()">
                        ❌ No
                    </button>
                </div>
                       <!-- Type of studies -->
                <div class="gap-2" id="typeOfStudyButtons" hidden>
                    <p>Are you a looking to study an undergrad, a grad or an online course?.</p>
                    <button class="btn btn-outline-primary program-option" data-program="undergrads" onclick="underGradListener()">
                        Undergraduate studies
                    </button>
                    <button class="btn btn-outline-primary program-option" data-program="grads" onclick="gradListener()">
                        Graduate studies
                    </button>
                    <button class="btn btn-outline-primary program-option" data-program="online" onclick="onlineStudiesListener()">
                        Online courses
                    </button>
                </div>
                <!-- Undergrad Program options as buttons -->
                <div class="gap-2" id="undergrads" hidden>
                    <button class="btn btn-outline-primary program-option" data-program="computer-bsc_cs" onclick="redirect('/programs/bsc-in-computer-science/')">
                        🖥️ BSc in Computer Science
                    </button>
                    <button class="btn btn-outline-primary program-option" data-program="ba_economics" onclick="redirect('/programs/ba-in-economics/')">
                        📈 BA in Economics
                    </button>
                </div>
                <div class="gap-2" id="grads" hidden>
                    <button class="btn btn-outline-primary program-option" data-program="mba" onclick="redirect('/programs/mba/')">
                        💼 MBA
                    </button>
                    <button class="btn btn-outline-primary program-option" data-program="mdsc_datascience" onclick="redirect('/programs/mdsc-in-data-science/')">
                        🖥 MDSc in Data Science
                    </button>
                </div>
                <div class="gap-2" id="online" hidden>
                    <button class="btn btn-outline-primary program-option" data-program="webdev_online" onclick="redirect('/programs/web-development-bootcamp/')">
                        🌐 Web development bootcamp
                    </button>
                    <button class="btn btn-outline-primary program-option" data-program="ai_intro" onclick="redirect('/programs/introduction-to-ai/')">
                        🤖 Introduction to AI
                    </button>
                </div>
                <div class="gap-2" id="studentButtons" hidden>
                    <button class="btn btn-outline-primary program-option" data-program="computer-science">
                        Email me my program's resources
                    </button>
                    <button class="btn btn-outline-primary program-option" data-program="business">
                        I want to contact an administrator
                    </button>
                </div>
                </div>
                <div class="modal-footer">
                    <input type="text" class="form-control" placeholder="Type your question...">
                    <button class="btn btn-primary">Send</button>
                </div>
            </div>
        </div>
    </div>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>

    let conversationState = 'asking-if-student';
    function redirect(path) {
    window.location.href = path;
    }
    function yesListener(){
        document.getElementById('studentButtons').hidden=false;
        document.getElementById('initialDecision').hidden=true;
    }
    function noListener(){
        document.getElementById('typeOfStudyButtons').hidden=false;
        document.getElementById('initialDecision').hidden=true;
    }
    function underGradListener(){
        document.getElementById('undergrads').hidden=false;
        document.getElementById('typeOfStudyButtons').hidden=true;
    }
    function gradListener(){
        document.getElementById('grads').hidden=false;
        document.getElementById('typeOfStudyButtons').hidden=true;
    }
    function onlineStudiesListener(){
        document.getElementById('online').hidden=false;
        document.getElementById('typeOfStudyButtons').hidden=true;
    }
    function addMessage(text, sender) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `alert ${sender === 'user' ? 'alert-primary ms-5' : 'alert-secondary'}`;
        messageDiv.innerHTML = `<strong>${sender === 'user' ? 'You' : 'Assistant'}:</strong> ${text}`;
        document.getElementById('chatMessages').appendChild(messageDiv);

        const chatMessages = document.getElementById('chatMessages');
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
    <!--return redirect('contact/') -->

    }
    </script>
    <script>//THIS MAY HAVE TO CHANGE IF WE MAKE MORE USER FLOWS
    function resetChatbotVisibility() {
        // Display only the yes or no
        document.getElementById('initialDecision').hidden = false;

        // Hides everything else
        document.getElementById('typeOfStudyButtons').hidden = true;
        document.getElementById('undergrads').hidden = true;
        document.getElementById('grads').hidden = true;
        document.getElementById('online').hidden = true;
        document.getElementById('studentButtons').hidden = true;

        // Scrolls back to the top of the chatbox
        document.getElementById('chatMessages').scrollTop = 0;
    }

    // Create listener after the chatbot modal has been initialized,
    // we await for the chatbot to be fully hidden to reset it back to its original state
    document.addEventListener('DOMContentLoaded', function () {
        const chatbotModal = document.getElementById('chatbotModal');
        chatbotModal.addEventListener('hidden.bs.modal', function () {
            resetChatbotVisibility();
        });
    });
    </script>
