{% load static %}

<!-- Chat Button -->
<button id="chatToggle" class="chat-btn btn btn-primary">
  💬 Chat with me
</button>

<!-- Chat Box -->
<div id="chatBox" class="chat-box shadow-lg">
  <div class="chat-header d-flex justify-content-between align-items-center">
    <span>NextGen Chatbot</span>
    <button id="closeChat" class="btn-close btn-sm"></button>
  </div>

  <div class="chat-body" id="chatBody">
    <div class="bot-message">Hi there! How can I help you today?</div>
    <div class="user-message">Hi, I want to know about courses.</div>
  </div>

  <div class="chat-footer d-flex align-items-center">
    <input type="text" id="userInput" class="form-control" placeholder="Type your message..." />
    <button id="sendBtn" class="btn btn-primary ms-2">Send</button>
  </div>
</div>
