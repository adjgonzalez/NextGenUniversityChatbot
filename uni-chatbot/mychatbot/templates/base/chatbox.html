{% load i18n static %}

<!-- Assign translation with apostrophe to a variable for safe JS use -->
{% trans "I'm interested in:" as interested_in_str %}

<!-- Bootstrap Chat Widget -->
<button class="btn btn-primary rounded-circle chatbot-btn"
        data-bs-toggle="modal"
        data-bs-target="#chatbotModal">
    💬
</button>

<!-- Chatbot Modal -->
<div class="modal fade" id="chatbotModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">{% trans "University Assistant" %}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" style="height: 300px; overflow-y: auto;" id="chatMessages">
                <div class="alert alert-info">
                    <p>{% trans "Hello! Welcome to the NextGen university chatbot." %}</p>
                    <strong>{% trans "Assistant:" %}</strong> {% trans "Are you already a student?" %}
                </div>
                <div class="gap-2" id="initialDecision">
                    <button class="btn btn-outline-primary" id='yesButton' onclick="yesListener()">
                        ✅ {% trans "Yes" %}
                    </button>
                    <button class="btn btn-outline-primary" id='noButton' onclick="noListener()">
                        ❌ {% trans "No" %}
                    </button>
                </div>
            </div>

            <div class="modal-footer" id="chatbotFooter" style="display: none;">
                <div class="w-100 mb-2">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="sendTranscript">
                        <label class="form-check-label" for="sendTranscript">
                            📧 {% trans "Email me this conversation" %}
                        </label>
                    </div>
                    <input type="email" class="form-control mt-2" id="userEmail" placeholder="{% trans 'Your email address' %}" style="display: none;">
                </div>
                <input type="text" class="form-control" placeholder="{% trans 'Type your question...' %}" id="userInput">
                <button class="btn btn-primary" onclick="sendMessage()">{% trans "Send" %}</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const TRANSLATIONS = {
    assistant: "{% trans 'Assistant' %}",
    you: "{% trans 'You' %}",
    yes: "{% trans 'Yes' %}",
    no: "{% trans 'No' %}",
    welcome: "{% trans 'Hello! Welcome to the NextGen university chatbot.' %}",
    studentQuestion: "{% trans 'Are you already a student?' %}",
    whatWouldYouLike: "{% trans 'What would you like to do?' %}",
    whatTypeOfProgram: "{% trans 'What type of program are you interested in?' %}",
    whichUndergraduate: "{% trans 'Which undergraduate program interests you?' %}",
    whichGraduate: "{% trans 'Which graduate program interests you?' %}",
    whichOnline: "{% trans 'Which online course interests you?' %}",
    pleaseProvideEmail: "{% trans 'Please provide your email address and we will send your program resources.' %}",
    describeIssue: "{% trans 'Please use the message box below to describe your issue. Check the box to receive a transcript of this conversation.' %}",
    thankYouMessage: "{% trans 'Thank you for your message. An administrator will contact you shortly. Please ensure your email is correct to receive updates.' %}",
    takingYouTo: "{% trans 'Taking you to the' %}",
    page: "{% trans 'page...' %}",
    interestedIn: "{{ interested_in_str }}",  // This is now safe
    emailResources: "{% trans 'Email me my program resources' %}",
    contactAdministrator: "{% trans 'Contact Administrator' %}",
    undergraduate: "{% trans 'Undergraduate' %}",
    graduate: "{% trans 'Graduate' %}",
    onlineCourses: "{% trans 'Online Courses' %}",
    bscComputerScience: "{% trans 'BSc in Computer Science' %}",
    baEconomics: "{% trans 'BA in Economics' %}",
    mba: "{% trans 'MBA' %}",
    mdscDataScience: "{% trans 'MDSc in Data Science' %}",
    webDevelopment: "{% trans 'Web Development Bootcamp' %}",
    introductionAI: "{% trans 'Introduction to AI' %}",
    yesStudent: "{% trans 'Yes, I am a student' %}",
    noStudent: "{% trans 'No, I am not a student' %}",
    undergraduatePrograms: "{% trans 'Undergraduate programs' %}",
    graduatePrograms: "{% trans 'Graduate programs' %}",
    onlineCourses: "{% trans 'Online courses' %}",
    contactAdminMessage: "{% trans 'I want to contact an administrator' %}",
    transcriptSent: "{% trans 'Transcript sent to your email!' %}",
    failedToSend: "{% trans 'Failed to send transcript.' %}",
    includeEmail: "{% trans 'Please include your email above to receive program resources' %}",
    selectProgram: "{% trans 'Please select a program' %}",
    programSent: "{% trans 'Program resources sent to your email!' %}"
};

// Hard-coded program list (slug + display name) - edit if you want to change
const HARD_CODED_PROGRAMS = [
    { slug: 'bsc-computer-science', name: TRANSLATIONS.bscComputerScience },
    { slug: 'ba-economics', name: TRANSLATIONS.baEconomics },
    { slug: 'mba', name: TRANSLATIONS.mba },
    { slug: 'mdsc-data-science', name: TRANSLATIONS.mdscDataScience },
    { slug: 'web-development-bootcamp', name: TRANSLATIONS.webDevelopment },
    { slug: 'introduction-to-ai', name: TRANSLATIONS.introductionAI }
];

let conversationHistory = [
    { sender: "assistant", message: TRANSLATIONS.welcome },
    { sender: "assistant", message: TRANSLATIONS.studentQuestion }
];

let isAdminContactMode = false;
let pendingEmail = null;
let pendingProgram = null;
let resourceRequestInProgress = false;

// Helper: get cookie (for CSRF)
function getCookie(name) {
    var cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        var cookies = document.cookie.split(';');
        for (var i = 0; i < cookies.length; i++) {
            var cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

// Preferred CSRF getter: hidden input if present, else cookie
function getCSRFToken() {
    return document.querySelector('[name=csrfmiddlewaretoken]')?.value || getCookie('csrftoken') || '';
}

// Message and UI helpers
function addToConversation(sender, message) {
    conversationHistory.push({ sender: sender, message: message });
    const chatMessages = document.getElementById('chatMessages');
    const messageDiv = document.createElement('div');
    messageDiv.className = `alert ${sender === 'user' ? 'alert-primary' : 'alert-info'}`;
    messageDiv.innerHTML = `<strong>${sender === 'user' ? TRANSLATIONS.you : TRANSLATIONS.assistant}:</strong> ${message}`;
    chatMessages.appendChild(messageDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

function showButtons(buttonHTML) {
    const chatMessages = document.getElementById('chatMessages');
    const buttonContainer = document.createElement('div');
    buttonContainer.className = 'gap-2 mt-2';
    buttonContainer.innerHTML = buttonHTML;
    chatMessages.appendChild(buttonContainer);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

function hideAllButtons() {
    const buttonContainers = document.querySelectorAll('#chatMessages .gap-2');
    buttonContainers.forEach(container => {
        container.remove();
    });
}

function toggleFooter(show) {
    const footer = document.getElementById('chatbotFooter');
    footer.style.display = show ? 'block' : 'none';
    isAdminContactMode = show;
}

// --- EMAIL RESOURCE NEW FLOW: show program dropdown + email input ---
// Replaces the prior enrollment check flow; we will send resources immediately
function showEmailOption() {
    hideAllButtons();
    toggleFooter(false);
    resourceRequestInProgress = true;
    pendingEmail = null;
    pendingProgram = null;
    addToConversation('assistant', TRANSLATIONS.pleaseProvideEmail);
    showEmailCollectionForm();
}

function showEmailCollectionForm() {
    const existingForm = document.getElementById('programEmailForm');
    if (existingForm) existingForm.remove();

    const chatMessages = document.getElementById('chatMessages');
    const formDiv = document.createElement('div');
    formDiv.id = 'programEmailForm';
    formDiv.className = 'mt-2';

    // Build select options from hard-coded list
    let optionsHtml = '<option value="">' + TRANSLATIONS.selectProgram + '</option>';
    HARD_CODED_PROGRAMS.forEach(function (p) {
        optionsHtml += `<option value="${p.slug}">${p.name}</option>`;
    });

    formDiv.innerHTML = `
        <div class="mb-2">
            <label for="programSelect" class="form-label visually-hidden">${TRANSLATIONS.selectProgram}</label>
            <select id="programSelect" class="form-select mb-2">${optionsHtml}</select>
        </div>
        <div class="mb-2">
            <input type="email" class="form-control" id="programEmailInput"
                required placeholder="${TRANSLATIONS.includeEmail}">
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-success" type="button" id="programEmailSubmit">Send</button>
            <button class="btn btn-secondary" type="button" id="programEmailCancel">Cancel</button>
        </div>
    `;
    chatMessages.appendChild(formDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;

    document.getElementById('programEmailCancel').addEventListener('click', function () {
        document.getElementById('programEmailForm')?.remove();
    });

    document.getElementById('programEmailSubmit').addEventListener('click', function () {
        submitProgramEmail();
    });

    // allow Enter to submit quickly
    const emailInput = document.getElementById('programEmailInput');
    emailInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            submitProgramEmail();
        }
    });
}

function submitProgramEmail() {
    const emailInput = document.getElementById('programEmailInput');
    const programSelect = document.getElementById('programSelect');
    const email = emailInput?.value?.trim();
    const programSlug = programSelect?.value;
    const programName = programSelect?.options[programSelect.selectedIndex]?.text || '';

    if (!email) {
        showAlert('{% trans "Please enter a valid email address." %}', 'danger');
        return;
    }
    if (!programSlug) {
        showAlert(TRANSLATIONS.selectProgram, 'danger');
        return;
    }

    pendingEmail = email;
    pendingProgram = { slug: programSlug, name: programName };

    // reflect in conversation, then send immediately (no enrollment confirmation)
    addToConversation('user', `My email: ${email}`);
    addToConversation('user', `Program: ${programName}`);

    // Remove the form from UI
    document.getElementById('programEmailForm')?.remove();

    // Send request to server (no enrollment check)
    fetch('/send-program-resources/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCSRFToken()
        },
        body: JSON.stringify({
            email: pendingEmail,
            program_slug: pendingProgram.slug,
            program_name: pendingProgram.name
        })
    })
    .then(response => response.json().catch(()=>({})))
    .then(data => {
        if (data && data.success) {
            addToConversation('assistant', TRANSLATIONS.programSent);
            showAlert(TRANSLATIONS.programSent, 'success');
        } else {
            addToConversation('assistant', data.message || '{% trans "Failed to send program resources." %}');
            showAlert(data.message || '{% trans "Failed to send program resources." %}', 'danger');
        }
        resourceRequestInProgress = false;
        pendingEmail = null;
        pendingProgram = null;
    })
    .catch(() => {
        addToConversation('assistant', '{% trans "There was an error sending your resources. Please try again later." %}');
        showAlert('{% trans "There was an error sending your resources. Please try again later." %}', 'danger');
        resourceRequestInProgress = false;
        pendingEmail = null;
        pendingProgram = null;
    });
}

// Button click handlers (unchanged besides calling new showEmailOption)
function yesListener(){
    hideAllButtons();
    toggleFooter(false);
    addToConversation('user', `✅ ${TRANSLATIONS.yesStudent}`);
    addToConversation('assistant', TRANSLATIONS.whatWouldYouLike);

    const studentButtonsHTML = `
        <button class="btn btn-outline-primary program-option" onclick="addToConversation('user', '📧 ${TRANSLATIONS.emailResources}'); showEmailOption()">
            📧 ${TRANSLATIONS.emailResources}
        </button>
        <button class="btn btn-outline-primary program-option" onclick="contactAdmin()">
            👨‍💼 ${TRANSLATIONS.contactAdministrator}
        </button>
    `;
    showButtons(studentButtonsHTML);
}

function noListener(){
    hideAllButtons();
    toggleFooter(false);
    addToConversation('user', `❌ ${TRANSLATIONS.noStudent}`);
    addToConversation('assistant', TRANSLATIONS.whatTypeOfProgram);

    const studyTypeButtonsHTML = `
        <button class="btn btn-outline-primary program-option" onclick="underGradListener()">
            🎓 ${TRANSLATIONS.undergraduate}
        </button>
        <button class="btn btn-outline-primary program-option" onclick="gradListener()">
            📖 ${TRANSLATIONS.graduate}
        </button>
        <button class="btn btn-outline-primary program-option" onclick="onlineStudiesListener()">
            🌐 ${TRANSLATIONS.onlineCourses}
        </button>
    `;
    showButtons(studyTypeButtonsHTML);
}

// rest of handlers unchanged
function underGradListener(){
    hideAllButtons();
    toggleFooter(false);
    addToConversation('user', `🎓 ${TRANSLATIONS.undergraduatePrograms}`);
    addToConversation('assistant', TRANSLATIONS.whichUndergraduate);

    const undergradButtonsHTML = `
        <button class="btn btn-outline-primary program-option" onclick="redirect('/programs/bsc-in-computer-science/', '🎓 ${TRANSLATIONS.bscComputerScience}')">
            🖥️ ${TRANSLATIONS.bscComputerScience}
        </button>
        <button class="btn btn-outline-primary program-option" onclick="redirect('/programs/ba-in-economics/', '🎓 ${TRANSLATIONS.baEconomics}')">
            📈 ${TRANSLATIONS.baEconomics}
        </button>
    `;
    showButtons(undergradButtonsHTML);
}

function gradListener(){
    hideAllButtons();
    toggleFooter(false);
    addToConversation('user', `🎯 ${TRANSLATIONS.graduatePrograms}`);
    addToConversation('assistant', TRANSLATIONS.whichGraduate);

    const gradButtonsHTML = `
        <button class="btn btn-outline-primary program-option" onclick="redirect('/programs/mba/', '🎯 ${TRANSLATIONS.mba}')">
            💼 ${TRANSLATIONS.mba}
        </button>
        <button class="btn btn-outline-primary program-option" onclick="redirect('/programs/mdsc-in-data-science/', '🎯 ${TRANSLATIONS.mdscDataScience}')">
            📊 ${TRANSLATIONS.mdscDataScience}
        </button>
    `;
    showButtons(gradButtonsHTML);
}

function onlineStudiesListener(){
    hideAllButtons();
    toggleFooter(false);
    addToConversation('user', `🌐 ${TRANSLATIONS.onlineCourses}`);
    addToConversation('assistant', TRANSLATIONS.whichOnline);

    const onlineButtonsHTML = `
        <button class="btn btn-outline-primary program-option" onclick="redirect('/programs/web-development-bootcamp/', '🌐 ${TRANSLATIONS.webDevelopment}')">
            🌐 ${TRANSLATIONS.webDevelopment}
        </button>
        <button class="btn btn-outline-primary program-option" onclick="redirect('/programs/introduction-to-ai/', '🌐 ${TRANSLATIONS.introductionAI}')">
            🤖 ${TRANSLATIONS.introductionAI}
        </button>
    `;
    showButtons(onlineButtonsHTML);
}

function redirect(path, programName){
    hideAllButtons();
    toggleFooter(false);
    addToConversation('user', `${TRANSLATIONS.interestedIn} ${programName}`);
    addToConversation('assistant', `${TRANSLATIONS.takingYouTo} ${programName} ${TRANSLATIONS.page}`);
    setTimeout(() => {
        window.location.href = path;
    }, 1500);
}

// Student option function for contacting admin
function contactAdmin() {
    hideAllButtons();
    toggleFooter(true);
    addToConversation('user', `👨‍💼 ${TRANSLATIONS.contactAdminMessage}`);
    addToConversation('assistant', TRANSLATIONS.describeIssue);

    document.getElementById('sendTranscript').checked = true;
    document.getElementById('userEmail').style.display = 'block';
}

function sendMessage() {
    if (!isAdminContactMode) return;
    const userInput = document.getElementById('userInput');
    const message = userInput.value.trim();
    if (message) {
        addToConversation('user', message);
        addToConversation('assistant', TRANSLATIONS.thankYouMessage);
        userInput.value = '';
        const userEmail = document.getElementById('userEmail').value;
        if (userEmail) {
            sendTranscript();
        }
    }
}

function sendTranscript() {
    const sendTranscriptCheckbox = document.getElementById('sendTranscript').checked;
    const userEmailInput = document.getElementById('userEmail').value;
    if (sendTranscriptCheckbox && userEmailInput) {
        fetch('/send-transcript/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCSRFToken()
            },
            body: JSON.stringify({
                'email': userEmailInput,
                'conversation': conversationHistory
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                showAlert(TRANSLATIONS.transcriptSent, 'success');
            } else {
                showAlert(TRANSLATIONS.failedToSend, 'error');
            }
        });
    }
}

function showAlert(message, type) {
    const alertDiv = document.createElement('div');
    alertDiv.className = `alert alert-${type === 'success' ? 'success' : 'danger'} mt-2`;
    alertDiv.textContent = message;
    document.querySelector('.modal-footer').prepend(alertDiv);
    setTimeout(() => alertDiv.remove(), 3000);
}

function resetChatbotVisibility() {
    conversationHistory = [
        { sender: "assistant", message: TRANSLATIONS.welcome },
        { sender: "assistant", message: TRANSLATIONS.studentQuestion }
    ];

    const chatMessages = document.getElementById('chatMessages');
    chatMessages.innerHTML = `
        <div class="alert alert-info">
            <p>${TRANSLATIONS.welcome}</p>
            <strong>${TRANSLATIONS.assistant}:</strong> ${TRANSLATIONS.studentQuestion}
        </div>
        <div class="gap-2" id="initialDecision">
            <button class="btn btn-outline-primary" id='yesButton' onclick="yesListener()">
                ✅ ${TRANSLATIONS.yes}
            </button>
            <button class="btn btn-outline-primary" id='noButton' onclick="noListener()">
                ❌ ${TRANSLATIONS.no}
            </button>
        </div>
    `;
    document.getElementById('sendTranscript').checked = false;
    document.getElementById('userEmail').style.display = 'none';
    document.getElementById('userEmail').value = '';
    document.getElementById('userInput').value = '';
    toggleFooter(false);
    isAdminContactMode = false;
    resourceRequestInProgress = false;
    pendingEmail = null;
    pendingProgram = null;
    chatMessages.scrollTop = 0;
}

document.addEventListener('DOMContentLoaded', function () {
    const chatbotModal = document.getElementById('chatbotModal');
    chatbotModal.addEventListener('hidden.bs.modal', function () {
        resetChatbotVisibility();
    });

    document.getElementById('sendTranscript').addEventListener('change', function() {
        const emailInput = document.getElementById('userEmail');
        emailInput.style.display = this.checked ? 'block' : 'none';
        if (!this.checked) emailInput.value = '';
    });

    document.getElementById('userInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && isAdminContactMode) {
            sendMessage();
        }
    });
});
</script>
