<!-- Floating chat button to open modal -->
<button class="btn btn-primary rounded-circle chatbot-btn"
        data-bs-toggle="modal"
        data-bs-target="#chatbotModal">
    💬
</button>

<!-- Chatbot Modal -->
<div class="modal fade" id="chatbotModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <!-- Chatbot modal header -->
                <h5 class="modal-title">University Assistant</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" style="height: 300px; overflow-y: auto;" id="chatMessages">
                <!-- Initial chatbot introduction message -->
                <div class="alert alert-info">
                    <p>Hello! Welcome to the NextGen university chatbot.</p>
                    <strong>Assistant:</strong> Are you already a student?
                </div>
                <div class="gap-2" id="initialDecision">
                    <button class="btn btn-outline-primary" id='yesButton' onclick="yesListener()">
                        ✅ Yes
                    </button>
                    <button class="btn btn-outline-primary" id='noButton' onclick="noListener()">
                        ❌ No
                    </button>
                </div>
            </div>

            <!-- Footer area for follow-up input like email, transcript, or questions -->
            <div class="modal-footer" id="chatbotFooter" style="display: none;">
                <div class="w-100 mb-2">
                    <div class="form-check">
                        <!-- Checkbox to trigger sending the transcript -->
                        <input class="form-check-input" type="checkbox" id="sendTranscript">
                        <label class="form-check-label" for="sendTranscript">
                            📧 Email me this conversation
                        </label>
                    </div>
                    <!-- Email input for transcript sending -->
                    <input type="email" class="form-control mt-2" id="userEmail" placeholder="Your email address" style="display: none;">
                </div>
                <!-- Main chat input for questions -->
                <input type="text" class="form-control" placeholder="Type your question..." id="userInput">
                <button class="btn btn-primary" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Text responses, button labels, and other strings used by the chatbot throughout the UI
const CHATBOT_TEXT = {
    assistant: "Assistant",
    you: "You",
    yes: "Yes",
    no: "No",
    welcome: "Hello! Welcome to the NextGen university chatbot.",
    studentQuestion: "Are you already a student?",
    whatWouldYouLike: "What would you like to do?",
    whatTypeOfProgram: "What type of program are you interested in?",
    whichUndergraduate: "Which undergraduate program interests you?",
    whichGraduate: "Which graduate program interests you?",
    whichOnline: "Which online course interests you?",
    pleaseProvideEmail: "Please provide your email address and we will send your program resources.",
    describeIssue: "Please use the message box below to describe your issue. Check the box to receive a transcript of this conversation.",
    thankYouMessage: "Thank you for your message. An administrator will contact you shortly. Please ensure your email is correct to receive updates.",
    takingYouTo: "Taking you to the",
    page: "page...",
    emailResources: "Email me my program resources",
    contactAdministrator: "Contact Administrator",
    undergraduate: "Undergraduate",
    graduate: "Graduate",
    onlineCourses: "Online Courses",
    bscComputerScience: "BSc in Computer Science",
    baEconomics: "BA in Economics",
    mba: "MBA",
    mdscDataScience: "MDSc in Data Science",
    webDevelopment: "Web Development Bootcamp",
    introductionAI: "Introduction to AI",
    yesStudent: "Yes, I am a student",
    noStudent: "No, I am not a student",
    undergraduatePrograms: "Undergraduate programs",
    graduatePrograms: "Graduate programs",
    onlineCourses: "Online courses",
    contactAdminMessage: "I want to contact an administrator",
    transcriptSent: "Transcript sent to your email!",
    failedToSend: "Failed to send transcript.",
    includeEmail: "Please include your email above to receive program resources",
    selectProgram: "Please select a program",
    programSent: "Program resources sent to your email!"
};

// List of available programs for resource requests
const HARD_CODED_PROGRAMS = [
    { slug: 'bsc-computer-science', name: CHATBOT_TEXT.bscComputerScience },
    { slug: 'ba-economics', name: CHATBOT_TEXT.baEconomics },
    { slug: 'mba', name: CHATBOT_TEXT.mba },
    { slug: 'mdsc-data-science', name: CHATBOT_TEXT.mdscDataScience },
    { slug: 'web-development-bootcamp', name: CHATBOT_TEXT.webDevelopment },
    { slug: 'introduction-to-ai', name: CHATBOT_TEXT.introductionAI }
];

// Conversation history log
let conversationHistory = [
    { sender: "assistant", message: CHATBOT_TEXT.welcome },
    { sender: "assistant", message: CHATBOT_TEXT.studentQuestion }
];

let isAdminContactMode = false;
let pendingEmail = null;
let pendingProgram = null;
let resourceRequestInProgress = false;

// Helper to get CSRF token for AJAX in Django
function getCookie(name) {
    var cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        var cookies = document.cookie.split(';');
        for (var i = 0; i < cookies.length; i++) {
            var cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
function getCSRFToken() {
    return document.querySelector('[name=csrfmiddlewaretoken]')?.value || getCookie('csrftoken') || '';
}

// Add a message to the chat window and scroll to bottom
function addToConversation(sender, message) {
    conversationHistory.push({ sender: sender, message: message });
    const chatMessages = document.getElementById('chatMessages');
    const messageDiv = document.createElement('div');
    messageDiv.className = `alert ${sender === 'user' ? 'alert-primary' : 'alert-info'}`;
    messageDiv.innerHTML = `<strong>${sender === 'user' ? CHATBOT_TEXT.you : CHATBOT_TEXT.assistant}:</strong> ${message}`;
    chatMessages.appendChild(messageDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

// Helper to show button groups
function showButtons(buttonHTML) {
    const chatMessages = document.getElementById('chatMessages');
    const buttonContainer = document.createElement('div');
    buttonContainer.className = 'gap-2 mt-2';
    buttonContainer.innerHTML = buttonHTML;
    chatMessages.appendChild(buttonContainer);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

// Remove all button groups from chat
function hideAllButtons() {
    const buttonContainers = document.querySelectorAll('#chatMessages .gap-2');
    buttonContainers.forEach(container => {
        container.remove();
    });
}

// Show or hide the modal footer (used for admin contact mode)
function toggleFooter(show) {
    const footer = document.getElementById('chatbotFooter');
    footer.style.display = show ? 'block' : 'none';
    isAdminContactMode = show;
}

// Show the email resource request form
function showEmailOption() {
    hideAllButtons();
    toggleFooter(false);
    resourceRequestInProgress = true;
    pendingEmail = null;
    pendingProgram = null;
    addToConversation('assistant', CHATBOT_TEXT.pleaseProvideEmail);
    showEmailCollectionForm();
}

// Allow user to choose program and enter email
function showEmailCollectionForm() {
    const existingForm = document.getElementById('programEmailForm');
    if (existingForm) existingForm.remove();

    const chatMessages = document.getElementById('chatMessages');
    const formDiv = document.createElement('div');
    formDiv.id = 'programEmailForm';
    formDiv.className = 'mt-2';

    let optionsHtml = '<option value="">' + CHATBOT_TEXT.selectProgram + '</option>';
    HARD_CODED_PROGRAMS.forEach(function (p) {
        optionsHtml += `<option value="${p.slug}">${p.name}</option>`;
    });

    formDiv.innerHTML = `
        <div class="mb-2">
            <label for="programSelect" class="form-label visually-hidden">${CHATBOT_TEXT.selectProgram}</label>
            <select id="programSelect" class="form-select mb-2">${optionsHtml}</select>
        </div>
        <div class="mb-2">
            <input type="email" class="form-control" id="programEmailInput"
                required placeholder="${CHATBOT_TEXT.includeEmail}">
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-success" type="button" id="programEmailSubmit">Send</button>
            <button class="btn btn-secondary" type="button" id="programEmailCancel">Cancel</button>
        </div>
    `;
    chatMessages.appendChild(formDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;

    document.getElementById('programEmailCancel').addEventListener('click', function () {
        document.getElementById('programEmailForm')?.remove();
    });

    document.getElementById('programEmailSubmit').addEventListener('click', function () {
        submitProgramEmail();
    });

    const emailInput = document.getElementById('programEmailInput');
    emailInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            submitProgramEmail();
        }
    });
}

// Handle sending program resources to given email
function submitProgramEmail() {
    const emailInput = document.getElementById('programEmailInput');
    const programSelect = document.getElementById('programSelect');
    const email = emailInput?.value?.trim();
    const programSlug = programSelect?.value;
    const programName = programSelect?.options[programSelect.selectedIndex]?.text || '';

    if (!email) {
        showAlert("Please enter a valid email address.", 'danger');
        return;
    }
    if (!programSlug) {
        showAlert(CHATBOT_TEXT.selectProgram, 'danger');
        return;
    }

    pendingEmail = email;
    pendingProgram = { slug: programSlug, name: programName };

    addToConversation('user', `My email: ${email}`);
    addToConversation('user', `Program: ${programName}`);

    document.getElementById('programEmailForm')?.remove();

    fetch('/send-program-resources/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCSRFToken()
        },
        body: JSON.stringify({
            email: pendingEmail,
            program_slug: pendingProgram.slug,
            program_name: pendingProgram.name
        })
    })
    .then(response => response.json().catch(()=>({})))
    .then(data => {
        if (data && data.success) {
            addToConversation('assistant', CHATBOT_TEXT.programSent);
            showAlert(CHATBOT_TEXT.programSent, 'success');
        } else {
            addToConversation('assistant', data.message || "Failed to send program resources.");
            showAlert(data.message || "Failed to send program resources.", 'danger');
        }
        resourceRequestInProgress = false;
        pendingEmail = null;
        pendingProgram = null;
    })
    .catch(() => {
        addToConversation('assistant', "There was an error sending your resources. Please try again later.");
        showAlert("There was an error sending your resources. Please try again later.", 'danger');
        resourceRequestInProgress = false;
        pendingEmail = null;
        pendingProgram = null;
    });
}

// Handlers for student's initial Yes/No responses
function yesListener(){
    hideAllButtons();
    toggleFooter(false);
    addToConversation('user', `✅ ${CHATBOT_TEXT.yesStudent}`);
    addToConversation('assistant', CHATBOT_TEXT.whatWouldYouLike);

    const studentButtonsHTML = `
        <button class="btn btn-outline-primary program-option" onclick="addToConversation('user', '📧 ${CHATBOT_TEXT.emailResources}'); showEmailOption()">
            📧 ${CHATBOT_TEXT.emailResources}
        </button>
        <button class="btn btn-outline-primary program-option" onclick="contactAdmin()">
            👨‍💼 ${CHATBOT_TEXT.contactAdministrator}
        </button>
    `;
    showButtons(studentButtonsHTML);
}

function noListener(){
    hideAllButtons();
    toggleFooter(false);
    addToConversation('user', `❌ ${CHATBOT_TEXT.noStudent}`);
    addToConversation('assistant', CHATBOT_TEXT.whatTypeOfProgram);

    const studyTypeButtonsHTML = `
        <button class="btn btn-outline-primary program-option" onclick="underGradListener()">
            🎓 ${CHATBOT_TEXT.undergraduate}
        </button>
        <button class="btn btn-outline-primary program-option" onclick="gradListener()">
            📖 ${CHATBOT_TEXT.graduate}
        </button>
        <button class="btn btn-outline-primary program-option" onclick="onlineStudiesListener()">
            🌐 ${CHATBOT_TEXT.onlineCourses}
        </button>
    `;
    showButtons(studyTypeButtonsHTML);
}

function underGradListener(){
    hideAllButtons();
    toggleFooter(false);
    addToConversation('user', `🎓 ${CHATBOT_TEXT.undergraduatePrograms}`);
    addToConversation('assistant', CHATBOT_TEXT.whichUndergraduate);

    const undergradButtonsHTML = `
        <button class="btn btn-outline-primary program-option" onclick="redirect('/programs/bsc-in-computer-science/', '🎓 ${CHATBOT_TEXT.bscComputerScience}')">
            🖥️ ${CHATBOT_TEXT.bscComputerScience}
        </button>
        <button class="btn btn-outline-primary program-option" onclick="redirect('/programs/ba-in-economics/', '🎓 ${CHATBOT_TEXT.baEconomics}')">
            📈 ${CHATBOT_TEXT.baEconomics}
        </button>
    `;
    showButtons(undergradButtonsHTML);
}

function gradListener(){
    hideAllButtons();
    toggleFooter(false);
    addToConversation('user', `🎯 ${CHATBOT_TEXT.graduatePrograms}`);
    addToConversation('assistant', CHATBOT_TEXT.whichGraduate);

    const gradButtonsHTML = `
        <button class="btn btn-outline-primary program-option" onclick="redirect('/programs/mba/', '🎯 ${CHATBOT_TEXT.mba}')">
            💼 ${CHATBOT_TEXT.mba}
        </button>
        <button class="btn btn-outline-primary program-option" onclick="redirect('/programs/mdsc-in-data-science/', '🎯 ${CHATBOT_TEXT.mdscDataScience}')">
            📊 ${CHATBOT_TEXT.mdscDataScience}
        </button>
    `;
    showButtons(gradButtonsHTML);
}

function onlineStudiesListener(){
    hideAllButtons();
    toggleFooter(false);
    addToConversation('user', `🌐 ${CHATBOT_TEXT.onlineCourses}`);
    addToConversation('assistant', CHATBOT_TEXT.whichOnline);

    const onlineButtonsHTML = `
        <button class="btn btn-outline-primary program-option" onclick="redirect('/programs/web-development-bootcamp/', '🌐 ${CHATBOT_TEXT.webDevelopment}')">
            🌐 ${CHATBOT_TEXT.webDevelopment}
        </button>
        <button class="btn btn-outline-primary program-option" onclick="redirect('/programs/introduction-to-ai/', '🌐 ${CHATBOT_TEXT.introductionAI}')">
            🤖 ${CHATBOT_TEXT.introductionAI}
        </button>
    `;
    showButtons(onlineButtonsHTML);
}

// Redirects user to program detail page after selection
function redirect(path, programName){
    hideAllButtons();
    toggleFooter(false);
    addToConversation('user', `${programName}`);
    addToConversation('assistant', `${CHATBOT_TEXT.takingYouTo} ${programName} ${CHATBOT_TEXT.page}`);
    setTimeout(() => {
        window.location.href = path;
    }, 1500);
}

// Student option for contacting admin
function contactAdmin() {
    hideAllButtons();
    toggleFooter(true);
    addToConversation('user', `👨‍💼 ${CHATBOT_TEXT.contactAdminMessage}`);
    addToConversation('assistant', CHATBOT_TEXT.describeIssue);
    document.getElementById('sendTranscript').checked = true;
    document.getElementById('userEmail').style.display = 'block';
}

// Send message in admin contact mode, and send transcript if needed
function sendMessage() {
    if (!isAdminContactMode) return;
    const userInput = document.getElementById('userInput');
    const message = userInput.value.trim();
    if (message) {
        addToConversation('user', message);
        addToConversation('assistant', CHATBOT_TEXT.thankYouMessage);
        userInput.value = '';
        const userEmail = document.getElementById('userEmail').value;
        if (userEmail) {
            sendTranscript();
        }
    }
}

// Sends transcript via AJAX (POST)
function sendTranscript() {
    const sendTranscriptCheckbox = document.getElementById('sendTranscript').checked;
    const userEmailInput = document.getElementById('userEmail').value;
    if (sendTranscriptCheckbox && userEmailInput) {
        fetch('/send-transcript/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCSRFToken()
            },
            body: JSON.stringify({
                'email': userEmailInput,
                'conversation': conversationHistory
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                showAlert(CHATBOT_TEXT.transcriptSent, 'success');
            } else {
                showAlert(CHATBOT_TEXT.failedToSend, 'error');
            }
        });
    }
}

// Shows alert message in modal footer
function showAlert(message, type) {
    const alertDiv = document.createElement('div');
    alertDiv.className = `alert alert-${type === 'success' ? 'success' : 'danger'} mt-2`;
    alertDiv.textContent = message;
    document.querySelector('.modal-footer').prepend(alertDiv);
    setTimeout(() => alertDiv.remove(), 3000);
}

// Resets chatbot UI each time the widget is closed/reopened
function resetChatbotVisibility() {
    conversationHistory = [
        { sender: "assistant", message: CHATBOT_TEXT.welcome },
        { sender: "assistant", message: CHATBOT_TEXT.studentQuestion }
    ];

    const chatMessages = document.getElementById('chatMessages');
    chatMessages.innerHTML = `
        <div class="alert alert-info">
            <p>${CHATBOT_TEXT.welcome}</p>
            <strong>${CHATBOT_TEXT.assistant}:</strong> ${CHATBOT_TEXT.studentQuestion}
        </div>
        <div class="gap-2" id="initialDecision">
            <button class="btn btn-outline-primary" id='yesButton' onclick="yesListener()">
                ✅ ${CHATBOT_TEXT.yes}
            </button>
            <button class="btn btn-outline-primary" id='noButton' onclick="noListener()">
                ❌ ${CHATBOT_TEXT.no}
            </button>
        </div>
    `;
    document.getElementById('sendTranscript').checked = false;
    document.getElementById('userEmail').style.display = 'none';
    document.getElementById('userEmail').value = '';
    document.getElementById('userInput').value = '';
    toggleFooter(false);
    isAdminContactMode = false;
    resourceRequestInProgress = false;
    pendingEmail = null;
    pendingProgram = null;
    chatMessages.scrollTop = 0;
}

// On page ready, reset chatbot modal and setup input behaviors
document.addEventListener('DOMContentLoaded', function () {
    const chatbotModal = document.getElementById('chatbotModal');
    chatbotModal.addEventListener('hidden.bs.modal', function () {
        resetChatbotVisibility();
    });

    document.getElementById('sendTranscript').addEventListener('change', function() {
        const emailInput = document.getElementById('userEmail');
        emailInput.style.display = this.checked ? 'block' : 'none';
        if (!this.checked) emailInput.value = '';
    });

    document.getElementById('userInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && isAdminContactMode) {
            sendMessage();
        }
    });
});
</script>
