name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DJANGO_SETTINGS_MODULE: mysite.settings
  PYTHONPATH: "${{ github.workspace }}/uni-chatbot"
  DEBUG: "False"
  ALLOWED_HOSTS: "localhost,127.0.0.1,::1"
  SECRET_KEY: "django-insecure-{secrets.token_urlsafe(50)}"

jobs:
  # ===== UNIT TESTS & BASIC CHECKS =====
  test:
    runs-on: ubuntu-latest
    name: Unit Tests & Basic Checks
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        cd uni-chatbot
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install coverage

    - name: Run migrations
      run: |
        cd uni-chatbot
        python manage.py migrate --noinput

    - name: Run Django tests with coverage
      run: |
        cd uni-chatbot
        coverage run manage.py test
        coverage xml

    - name: Install coveralls CLI
      run: |
        cd uni-chatbot
        python -m pip install --upgrade pip
        pip install coveralls

    - name: Send coverage to Coveralls (via coveralls CLI)
      env:
        COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
      run: |
        cd uni-chatbot
        # coveralls CLI reads the .coverage data produced by `coverage run` and posts it.
        # Run with --verbose while debugging if needed.
        coveralls || python -m coveralls || (echo "Coveralls upload failed" && exit 1)
    # ------------------------------------------------------------------------------

    - name: Upload coverage artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-${{ github.run_id }}-${{ github.job }}-${{ matrix.python-version }}
        path: uni-chatbot/coverage.xml
        retention-days: 7

# ===== INTEGRATION TESTS =====
  integration-tests:
    runs-on: ubuntu-latest
    name: Integration Tests (integration_tests folder)
    timeout-minutes: 15
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        cd uni-chatbot
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run migrations
      run: |
        cd uni-chatbot
        python manage.py migrate --noinput

    - name: Run integration tests (explicit path)
      run: |
        cd uni-chatbot
        # Explicitly run the integration_tests folder (the discovery that works for you)
        python manage.py test -v 2 integration_tests

    - name: Upload test artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: integration-test-logs
        path: uni-chatbot/test_results/
        retention-days: 7

  # ===== E2E TESTS WITH ETHEREAL EMAIL =====
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: E2E Smoke Tests
    env:
      ETHEREAL_USER: ${{ secrets.ETHEREAL_USER }}
      ETHEREAL_PASSWORD: ${{ secrets.ETHEREAL_PASSWORD }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        cd uni-chatbot
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-playwright

    - name: Install Playwright browsers + system deps
      run: |
        npx playwright install --with-deps
        playwright install

    - name: Install gettext (for compilemessages)
      run: sudo apt-get update && sudo apt-get install -y gettext

    - name: Setup test environment with Ethereal host and in-memory email backend CI to avoid sending real SMTP messages
      run: |
        cd uni-chatbot
        python -c "import os, secrets; open('.env','w').write(
          f'DEBUG=True\n'
          f'SECRET_KEY=django-insecure-{secrets.token_urlsafe(50)}\n'
          f'ALLOWED_HOSTS=localhost,127.0.0.1,::1\n'
          f'EMAIL_BACKEND=django.core.mail.backends.locmem.EmailBackend\n'
          f'EMAIL_HOST=smtp.ethereal.email\n'
          f'EMAIL_HOST_USER={os.environ[\"ETHEREAL_USER\"]}\n'
          f'EMAIL_HOST_PASSWORD={os.environ[\"ETHEREAL_PASSWORD\"]}\n'
          f'EMAIL_PORT=587\n'
          f'EMAIL_USE_TLS=True\n'
          f'DEFAULT_FROM_EMAIL=noreply@nextgenuniversity.com\n')"
        python manage.py migrate
        python manage.py collectstatic --noinput

    - name: Run smoke tests
      run: |
        cd uni-chatbot
        python manage.py runserver 0.0.0.0:8000 &
        SERVER_PID=$!
        npx wait-on http://127.0.0.1:8000
        python ./system_tests/e2e_tests.py
        kill $SERVER_PID

    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-smoke-report
        path: uni-chatbot/test_results/
        retention-days: 7

  # ===== CODE QUALITY (Formatter/Linter) =====
  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install code quality tools
      run: |
        python -m pip install --upgrade pip
        pip install black ruff

    - name: Check code formatting
      run: |
        black --check uni-chatbot --exclude="venv/|__pycache__/|migrations/"

    - name: Run linting
      run: |
        ruff check uni-chatbot

  # ===== SECURITY SCAN (Bandit) =====
  security:
    runs-on: ubuntu-latest
    name: Security Scan

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit

    - name: Run security scan
      run: |
        bandit -r uni-chatbot -f json -o security-report.json || true

    - name: Upload security report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-report
        path: |
          security-report.json
          security-report.txt
        retention-days: 7