# CI
name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DJANGO_SETTINGS_MODULE: mysite.settings
  PYTHONPATH: "${{ github.workspace }}/uni-chatbot"
  DEBUG: "False"
  ALLOWED_HOSTS: "localhost,127.0.0.1,::1"
  SECRET_KEY: "django-insecure-{secrets.token_urlsafe(50)}"

jobs:
  # ===== UNIT TESTS & BASIC CHECKS =====
  test:
    runs-on: ubuntu-latest
    name: Unit Tests & Basic Checks
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        cd uni-chatbot
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install coverage

    - name: Run migrations
      run: |
        cd uni-chatbot
        python manage.py migrate --noinput

    - name: Run Django tests with coverage
      run: |
        cd uni-chatbot
        coverage run manage.py test
        coverage xml

    - name: Upload coverage to Coveralls
      uses: coverallsapp/github-action@v2.3.6
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path-to-lcov: uni-chatbot/coverage.xml

  # ===== E2E TESTS WITH LOCAL EMAIL BACKEND (CI) =====
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: E2E Smoke Tests
    env:
      ETHEREAL_USER: ${{ secrets.ETHEREAL_USER }}
      ETHEREAL_PASSWORD: ${{ secrets.ETHEREAL_PASSWORD }}
      FORCE_LOCAL_EMAIL: "true"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        cd uni-chatbot
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-playwright

    - name: Install Playwright browsers + system deps
      run: |
        npx playwright install --with-deps
        playwright install

    - name: Install gettext (for compilemessages)
      run: sudo apt-get update && sudo apt-get install -y gettext

    - name: Setup test environment (use local email backend)
      run: |
        cd uni-chatbot
        python - <<'PY'
import secrets, pathlib
env = []
env.append('DEBUG=True')
env.append(f'SECRET_KEY=django-insecure-{secrets.token_urlsafe(50)}')
env.append('ALLOWED_HOSTS=localhost,127.0.0.1,::1')
# Force using Django's in-memory email backend in CI to avoid SMTP errors
env.append('EMAIL_BACKEND=django.core.mail.backends.locmem.EmailBackend')
env.append('DEFAULT_FROM_EMAIL=noreply@nextgenuniversity.com')
p = pathlib.Path('.env')
p.write_text("\n".join(env))
print('.env written (local email backend)')
PY
        python manage.py migrate
        python manage.py collectstatic --noinput

    - name: Run smoke tests
      run: |
        cd uni-chatbot
        python manage.py runserver 0.0.0.0:8000 &
        SERVER_PID=$!
        npx wait-on http://127.0.0.1:8000
        python ./system_tests/e2e_tests.py
        kill $SERVER_PID

    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-smoke-report
        path: uni-chatbot/test_results/
        retention-days: 7

  # ===== CODE QUALITY (Formatter/Linter) =====
  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install code quality tools
      run: |
        python -m pip install --upgrade pip
        pip install black ruff

    - name: Check code formatting
      run: |
        black --check uni-chatbot --exclude="venv/|__pycache__/|migrations/"

    - name: Run linting
      run: |
        ruff check uni-chatbot

  # ===== SECURITY SCAN (Bandit) =====
  security:
    runs-on: ubuntu-latest
    name: Security Scan

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit

    - name: Run security scan
      run: |
        bandit -r uni-chatbot -f json -o security-report.json || true

    - name: Upload security report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-report
        path: |
          security-report.json
          security-report.txt
        retention-days: 7