name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ===== UNIT TESTS & BASIC CHECKS =====
  test:
    runs-on: ubuntu-latest
    name: Unit Tests & Basic Checks
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        cd uni-chatbot
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install coverage

    - name: Setup test environment
      run: |
        cd uni-chatbot
        python -c "
        import secrets
        with open('.env', 'w') as f:
            f.write(f'DEBUG=True\\n')
            f.write(f'SECRET_KEY=django-insecure-{secrets.token_urlsafe(50)}\\n')
            f.write(f'ALLOWED_HOSTS=localhost,127.0.0.1,::1\\n')
            f.write(f'STATIC_ROOT=staticfiles\\n')
        "
        python manage.py migrate
        python manage.py collectstatic --noinput

    - name: Run Django tests with coverage
      run: |
        cd uni-chatbot
        coverage run manage.py test
        coverage xml

    - name: Upload coverage to Coveralls
      uses: coverallsapp/github-action@v2.3.6
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path-to-lcov: uni-chatbot/coverage.xml

  # ===== E2E TESTS WITH ETHEREAL EMAIL =====
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: E2E Smoke Tests

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        cd uni-chatbot
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-playwright

    - name: Install Playwright browsers
      run: |
        npx playwright install chromium
        npx playwright install-deps

    - name: Setup test environment with Ethereal
      run: |
        cd uni-chatbot
        python -c "
        import secrets
        with open('.env', 'w') as f:
            f.write(f'DEBUG=True\\n')
            f.write(f'SECRET_KEY=django-insecure-{secrets.token_urlsafe(50)}\\n')
            f.write(f'ALLOWED_HOSTS=localhost,127.0.0.1,::1\\n')
            # Ethereal configuration using secrets
            f.write(f'EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend\\n')
            f.write(f'EMAIL_HOST=smtp.ethereal.email\\n')
            f.write(f'EMAIL_HOST_USER=${{ secrets.ETHEREAL_USER }}\\n')
            f.write(f'EMAIL_HOST_PASSWORD=${{ secrets.ETHEREAL_PASSWORD }}\\n')
            f.write(f'EMAIL_PORT=587\\n')
            f.write(f'EMAIL_USE_TLS=True\\n')
            f.write(f'DEFAULT_FROM_EMAIL=noreply@nextgenuniversity.com\\n')
        "
        python manage.py migrate
        python manage.py collectstatic --noinput
        python manage.py compilemessages -l es -l fr

    - name: Run smoke tests
      run: |
        cd uni-chatbot
        python manage.py runserver &
        SERVER_PID=$!
        sleep 10
        npx playwright test --grep="@smoke" --timeout=30000
        kill $SERVER_PID

    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-smoke-report
        path: uni-chatbot/playwright-report/
        retention-days: 7

  # ===== CODE QUALITY =====
  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install code quality tools
      run: |
        pip install black ruff

    - name: Check code formatting
      run: |
        black --check uni-chatbot --exclude="venv/|__pycache__/|migrations/"

    - name: Run linting
      run: |
        ruff check uni-chatbot

  # ===== SECURITY SCAN =====
  security:
    runs-on: ubuntu-latest
    name: Security Scan

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install security tools
      run: |
        pip install bandit

    - name: Run security scan
      run: |
        bandit -r uni-chatbot -f json -o security-report.json || true

    - name: Upload security report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-report
        path: security-report.json
        retention-days: 7
